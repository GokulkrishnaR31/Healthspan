version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: healthspan_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: healthspan
      POSTGRES_USER: healthspan_user
      POSTGRES_PASSWORD: healthspan_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  # Backend API
  backend:
    build: ./backend
    container_name: healthspan_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ai:/app/ai
      - ./datasets:/app/datasets

  # Frontend Web Application
  web:
    build: ./web
    container_name: healthspan_web
    restart: unless-stopped
    env_file:
      - ./web/.env
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: